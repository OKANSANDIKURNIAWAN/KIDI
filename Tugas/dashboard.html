<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 240px 1fr;
        font-family:Arial, Helvetica, sans-serif;
        font-weight: bold;
        color: #000000;
        background-color: #0f0f0f;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh; 
      }

      .grid-container h1{
      font-family:Georgia, 'Times New Roman', Times, serif;  
      font-size: 40px;
      }

      .header {
        grid-column: 1/3;
        background-color: #1a1a1a;
        text-align: center;
        padding:30px;
        color: #d4af37;
        border-bottom:2px solid #D4AF37;

      }

      .sidebar {
        background-color: #131313;
        grid-column: 1;
        color: black;
        padding: 30px 20px;
      }

      .sidebar ul {
        list-style: none;
      }

      .sidebar ul li {
        margin-bottom: 20px; 
      }

      .sidebar ul li a {
        color: white; 
        text-decoration: none;
        display: block;
        padding: 8px;
      }

      .sidebar ul li a:hover {
        background-color: #D4AF37; 
        color: rgb(0, 0, 0); 
      }

      .maincontent {
        color: #ffffff;
        background-color: #0f0f0f;
        width: 100%;
        padding: 30px;
        grid-column: 2;
        gap: 20px;
      }
      
      .card-wrapper{
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 45px; 
      }
      
      .card{
        background-color: #323131;
        padding: 24px 25px;
        text-align: center;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(207, 172, 59, 0.3);
        transition: 0.3s;
      }

        .footer {
            grid-column: 1/3;
            background-color: #1a1a1a;
            text-align: center;
            padding: 15px;
            margin-top: auto; 
            color:#d4af37;
            border-top: 1px solid #D4AF37;
        }
    </style>
  </head>
  <body>
    <div class="grid-container">
        <div class="grid-item header">
          <h1>Dashboard Admin</h1>
          <h3>Okan Sandi Kurniawan</h3>
        </div>
      <div class="grid-item sidebar">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Tentang Saya</a></li>
          <li><a href="#">Hobi dan Minat</a></li>
          <li><a href="#">Pendidikan</a></li>
          <li><a href="#">Media Sosial</a></li>
        </ul>
        </div>

      <div class="grid-item maincontent">
        <div class="card-wrapper">
                <div class="card"><p>Home</p></div>
                <div class="card"><p>Tentang Saya</p></div>
                <div class="card"><p>Hobi dan Minat</p></div>
                <div class="card"><p>Pendidikan</p></div>
                <div class="card"><p>Media Sosial</p></div>
        </div>
        </div>

      <div class="grid-item footer">
        <p>Copyright &copy; 2026 Okan Sandi Kurniawan</p>
    </div>
  </body>
</html>
