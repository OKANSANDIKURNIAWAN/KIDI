    <title>Properti, Method, Object, Class</title>

  <body>
    <script>
      // MEMBUAT OBJECT HP
        let smartphone = {
          // PROPERTY (Data)
          merk: "Iphone",
          warna: "Hitam",
          ram: 8,

          // METHOD (TINDAKAN)
          nyalakanSenter: function () {
            console.log("Senter HP Nyala");
          },
        };

        // MEMANGGIL PROPERTI
        console.log("Merk HP:", smartphone.merk);
        console.log("Ukuran RAM:", smartphone.ram);
        console.log("Warna HP:", smartphone.warna);

        // MEMANGGIL METHOD
        smartphone.nyalakanSenter();
