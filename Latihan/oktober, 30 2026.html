<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Search</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #141414; /* Warna khas Netflix dark mode */
        margin: 0;
        padding: 40px 20px;
        color: #ffffff;
      }

      .container {
        max-width: 650px;
        margin: 0 auto;
        padding: 20px;
      }

      h2 {
        color: #e50914; /* Merah Netflix asli */
        margin-bottom: 5px;
        font-size: 32px;
        letter-spacing: 1px;
      }

      p.subtitle {
        color: #b3b3b3;
        margin-bottom: 25px;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        background-color: #333333;
        border: 1px solid #404040;
        border-radius: 4px;
        color: #ffffff;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #e50914;
      }

      input::placeholder {
        color: #8c8c8c;
      }

      .movie-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }

      .movie-card {
        display: flex;
        align-items: center;
        background-color: #1f1f1f;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #333333;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }

      .movie-card:hover {
        background-color: #262626;
        transform: scale(1.01);
      }

      .movie-card img {
        width: 70px;
        height: 100px;
        object-fit: cover;
      }

      .movie-info {
        padding: 0 20px;
        text-align: left;
      }

      .movie-title {
        font-size: 16px;
        font-weight: bold;
        color: #ffffff;
        margin: 0;
      }

      .status-text {
        color: #b3b3b3;
        font-size: 14px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>NETFLIX</h2>
      <p class="subtitle">Cari Film Favoritmu</p>

      <input
        type="text"
        id="searchBox"
        placeholder="Cari Film... (Naruto, One Piece, dll)"
      />
      <div class="movie-grid" id="movieGrid"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#searchBox").on("keyup", function () {
          let keyword = $(this).val().trim();

          if (keyword.length < 2) {
            $("#movieGrid").html("");
            return;
          }

          $("#movieGrid").html('<p class="status-text">Mencari film...</p>');

          $.get(
            `https://api.tvmaze.com/search/shows?q=${keyword}`,
            function (response) {
              $("#movieGrid").empty();

              if (response.length > 0) {
                $.each(response, function (index, item) {
                  let show = item.show;

                  let poster = show.image
                    ? show.image.medium
                    : "https://via.placeholder.com/70x100?text=No+Image";

                  let card = `
                    <div class="movie-card">
                        <img src="${poster}" alt="poster">
                        <div class="movie-info">
                            <h4 class="movie-title">${show.name}</h4>
                        </div>
                    </div>
                  `;
                  $("#movieGrid").append(card);
                });
              } else {
                $("#movieGrid").html(
                  '<p class="status-text">Film tidak ditemukan.</p>',
                );
              }
            },
          ).fail(function () {
            $("#movieGrid").html(
              '<p class="status-text">Gagal memuat data dari server.</p>',
            );
          });
        });
      });
    </script>
  </body>
</html>
