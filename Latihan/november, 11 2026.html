<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maps Detection Simple</title>

    <!-- memuat stylesheet peta leaflet padaa broswer (CDN) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        max-width: 500px;
        background: #ffffff;
        padding: 20px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      button {
        width: 100%;
        padding: 12px;
        background: #006419;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        color: white;
        cursor: pointer;
      }

      .status-box {
        margin-top: 20px;
        padding: 10px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 5px;
        text-align: left;
        background-color: #e3fae0;
        border: 1px solid #1b5e00;
      }

      #map {
        width: 100%;
        height: 300px;
        border-radius: 10px;
        margin-top: 10px;
        border: 1px solid #baceb1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Mencari Lokasiku</h2>
      <p>Tekan tombol di bawah ini!</p>
      <button id="btnGPS">Cari Lokasi Sekarang</button>

      <div class="status-box" id="infoStatus">
        Status: <b>Belum Aktif</b><br />
        Latitude/Longitude: -
      </div>
      <div id="map"></div>
    </div>

    <script>
      // 1. Membuat peta awal
      let map = L.map("map").setView([-6.1751, 106.865], 13); // Koordinat awal (Jakarta)

      // Mengambil gambar peta dari OpenStreetMap
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // Buat variabel untuk menampung pin letak awal
      var User = null;

      document.getElementById("btnGPS").addEventListener("click", function () {
        if (!navigator.geolocation) {
          alert("Browser tidak mendukung GPS");
          return;
        }

        document.getElementById("infoStatus").innerHTML =
          "Status: Sedang mencari titik lokasi";

        navigator.geolocation.getCurrentPosition(
          function (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            document.getElementById("infoStatus").innerHTML =
              `Status: Berhasil<br>Latitude/Longitude: ${lat}, ${lng}`;

            if (User) {
              map.removeLayer(User);
            }

            map.setView([lat, lng], 13);
            User = L.marker([lat, lng])
              .addTo(map)
              .bindPopup("Ini lokasi kamu sekarang")
              .openPopup();
          },
          function () {
            alert("Gagal mendapatkan lokasi. Aktifkan izin lokasi.");
            document.getElementById("infoStatus").innerHTML = "GPS ditolak";
          },
        );
      });
    </script>
  </body>
</html>
