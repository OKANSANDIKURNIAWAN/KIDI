<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #262424;
        padding: 30px;
        text-align: center;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        /* background-color: #262424; */
        padding: 20px;
        border-radius: 12px;
        /* box-shadow: 0 4px 10px rgba(67, 67, 67, 0.895); */
        text-align: center;
      }

      h2 {
        color: #ed3636;
        margin-bottom: 5px;
        font-size: 28px;
      }

      p {
        color: #ffffff;
        margin-bottom: 25px;
        font-size: 13px;
      }

      input {
        width: 100%;
        padding: 14px;
        background-color: #f5f5f5;
        border: 1px solid #ed3636;
        border-radius: 6px;
        color: #000000;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
      }

      input:focus {
        border-color: #ed3636;
        outline: none;
      }

      .movie-grid {
        gap: 15px;
        margin-top: 12px;
        text-align: left;
        display: grid;
      }

      .movie-card {
        background-color: #f9f7f7;
        border-radius: 6px;
        border: 2px solid #ed3636;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Netflix</h2>
      <p>Cari Film Favoritmu</p>

      <input
        type="text"
        id="searchBox"
        placeholder="Cari Film...(Naruto, One Piece, dll)"
      />
      <div class="movie-grid" id="movieGrid"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#searchBox").on("keyup", function () {
          let keyword = $(this).val().trim();

          if (keyword.length < 2) {
            $("#movieGrid").html("");
            return;
          }

          $("#movieGrid").html("<p>Cari Film di Server</p>");

          // ambil film dari API TVMaze
          $.get(
            `https://api.tvmaze.com/search/shows?q=${keyword}`,
            function (response) {
              $("#movieGrid").empty();

              if (response.length > 0) {
                $.each(response, function (index, item) {
                  let show = item.show;

                  let poster = show.image
                    ? show.image.medium
                    : "https://via.placeholder.com/150?text=No+Image";

                  let card = `
                  <div class="movie-card">
                        <img src="${poster}" alt="poster">
                        <div class ="movie-info">
                            <h4 class = "movie-tittle">${show.name}</h4>
                        </div>
                    </div>
                    `;
                  $("#movieGrid").append(card);
                });
              }
            },
          );
        });
      });
    </script>
  </body>
</html>
