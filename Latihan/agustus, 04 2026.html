    <!-- // syncrounus itu urut yaw

    <script>
      class Kucing {
        constructor(nama, suara) {
          this.nama = nama;
          this.suara = suara;
        }

        // Method object & Swutch case
        bersuara() {
          switch (true) {
            case this.suara === "meow":
              return "Kucing bersuara meow";
          }
        }
      }

      //   2. Fundamental & array
      const kelasRpl = [new Kucing("Mimi", "meow")];

      // Function & Error Handling
      //   function olahNilaiKelas(daftarSiswa) {
      //     console.log("=== Data Nilai Kelas RPL ===");

      try {
        // Looping for...of
        for (let kucing of daftarSiswa) {
          if (kucing.suara === "") {
            throw new Error(` ${kucing.nama} dengan suara ${kucing.suara}`);
          }
          console.log(
            `Nama: ${kucing.nama} | Suara: ${kucing.suara} | Status: ${kucing.bersuara()}`,
          );
        }
      } catch (error) {
        console.log(`Terjadi Error: ${error.message}`);
      } finally {
        console.log("========");
        console.log("Selesai diproses");
      }
      //   }
    </script>
