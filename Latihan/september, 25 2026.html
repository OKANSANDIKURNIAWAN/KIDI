<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO DO LIST SEDERHANA</title>
    <link rel="stylesheet" href="september, 25 2026.css" />
  </head>
  <body>
    <h1>MY TASK BOARD</h1>

    <!-- Form Input/Tambah Tugas Baru -->
    <div class="form-container">
      <input type="text" id="inputTask" placeholder="Tuliskan tugas baru" />
      <button id="btnTambah">Tambah Tugas</button>
    </div>

    <!-- Papan 2 kolom -->
    <div class="board">
      <div class="column">
        <h3>Belum Selesai</h3>
        <div id="colTodo"></div>
      </div>
      <div class="column">
        <h3>Selesai</h3>
        <div id="colDone"></div>
      </div>
    </div>
    <script src="september, 25 2026.js"></script>
  </body>
</html>
